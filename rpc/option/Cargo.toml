[package]
name = "option-engine"
version = "0.1.0"
edition = "2021"
description = "Database-backed public option snapshot and hedge-input layer"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
